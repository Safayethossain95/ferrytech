      <rect x="30" y="0" width="2" height="20" fill="#1e293b"/>
      <rect x="34" y="0" width="4" height="20" fill="#1e293b"/>
      <rect x="40" y="0" width="1" height="20" fill="#1e293b"/>
      <rect x="43" y="0" width="3" height="20" fill="#1e293b"/>
      <rect x="48" y="0" width="2" height="20" fill="#1e293b"/>
      <rect x="52" y="0" width="4" height="20" fill="#1e293b"/>
      <rect x="58" y="0" width="1" height="20" fill="#1e293b"/>
      <rect x="61" y="0" width="3" height="20" fill="#1e293b"/>
      <rect x="66" y="0" width="2" height="20" fill="#1e293b"/>
      <rect x="70" y="0" width="4" height="20" fill="#1e293b"/>
      <rect x="76" y="0" width="2" height="20" fill="#1e293b"/>
      <rect x="80" y="0" width="1" height="20" fill="#1e293b"/>
