    <text x="0" y="16" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8" letter-spacing="0.5">AUTH-VERIFY-ID: EMS 774192-SEC // GLOBAL ACCREDITED REGISTRAR // ISO HEAVY MACHINERY COMPLIANCE</text>
    
    <!-- Realistic Barcode Vector -->
