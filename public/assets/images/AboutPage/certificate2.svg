<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1250" width="900" height="1250">
  <defs>
    <!-- Realistic Wood Frame Multi-stop Gradient -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d07"/>
      <stop offset="15%" stop-color="#3d1e10"/>
      <stop offset="35%" stop-color="#221008"/>
      <stop offset="55%" stop-color="#4a2614"/>
      <stop offset="80%" stop-color="#1f0f07"/>
      <stop offset="100%" stop-color="#120804"/>
    </linearGradient>

    <!-- Frame Inner Bevel Highlight -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a311b"/>
      <stop offset="50%" stop-color="#2a140a"/>
      <stop offset="100%" stop-color="#140803"/>
    </linearGradient>

    <!-- Realistic Gold Leaf Fillet Gradient -->
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="20%" stop-color="#fff5cc"/>
      <stop offset="40%" stop-color="#b8860b"/>
      <stop offset="65%" stop-color="#fdf0a6"/>
      <stop offset="85%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#e6ca65"/>
    </linearGradient>

    <!-- Rich 3D Embossed Gold Seal Gradient -->
    <radialGradient id="sealEmboss" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="25%" stop-color="#ffd700"/>
      <stop offset="55%" stop-color="#b8860b"/>
      <stop offset="85%" stop-color="#8a5d09"/>
      <stop offset="100%" stop-color="#573a02"/>
    </radialGradient>

    <!-- Authentic Parchment Paper Background Gradient -->
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6e8"/>
      <stop offset="30%" stop-color="#f5eedc"/>
      <stop offset="70%" stop-color="#fbf8ec"/>
      <stop offset="100%" stop-color="#f2e8d0"/>
    </linearGradient>

    <!-- Glass Reflection Overlay Gradient -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Paper Texture Turbulence Filter -->
    <filter id="paperGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.91  0 0 0 0 0.83  0 0 0 0.12 0" in="noise" result="coloredNoise"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="coloredNoise"/>
    </filter>

    <!-- Frame Shadow -->
    <filter id="frameShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Seal 3D Drop Shadow -->
    <filter id="sealShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Guilloche Background Rosette Pattern -->
    <pattern id="guilloche" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 0 25 C 12.5 0, 37.5 50, 50 25 C 37.5 0, 12.5 50, 0 25 Z" fill="none" stroke="#d5c8ab" stroke-width="0.5" opacity="0.35"/>
      <path d="M 25 0 C 0 12.5, 50 37.5, 25 50 C 0 37.5, 50 12.5, 25 0 Z" fill="none" stroke="#d5c8ab" stroke-width="0.5" opacity="0.35"/>
      <circle cx="25" cy="25" r="18" fill="none" stroke="#e0d5ba" stroke-width="0.4" opacity="0.4"/>
    </pattern>

    <!-- Security Border Pattern -->
    <pattern id="secBorder" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0 15 L 15 0 L 30 15 L 15 30 Z" fill="none" stroke="#b8860b" stroke-width="0.75" opacity="0.7"/>
      <path d="M 7.5 15 L 15 7.5 L 22.5 15 L 15 22.5 Z" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- ==================== OUTER FRAME ==================== -->
  <!-- Main Wood Frame -->
  <rect x="15" y="15" width="870" height="1220" rx="10" fill="url(#frameGrad)" filter="url(#frameShadow)"/>
  
  <!-- Outer Bevel Edge Lines -->
  <rect x="25" y="25" width="850" height="1200" rx="6" fill="none" stroke="#0a0502" stroke-width="3"/>
  <rect x="28" y="28" width="844" height="1194" rx="4" fill="none" stroke="url(#bevelLight)" stroke-width="4"/>

  <!-- Inner Gold Leaf Fillet Molding -->
  <rect x="42" y="42" width="816" height="1166" fill="none" stroke="url(#goldLeaf)" stroke-width="7"/>
  <rect x="47" y="47" width="806" height="1156" fill="none" stroke="#2b1408" stroke-width="3"/>
  
  <!-- Mat Board Frame -->
  <rect x="52" y="52" width="796" height="1146" fill="#140a04"/>

  <!-- ==================== PARCHMENT DOCUMENT ==================== -->
  <rect x="62" y="62" width="776" height="1126" fill="url(#parchment)" filter="url(#paperGrain)"/>
  <rect x="62" y="62" width="776" height="1126" fill="url(#guilloche)"/>

  <!-- Document Vignette / Inset Shadow -->
  <rect x="62" y="62" width="776" height="1126" fill="none" stroke="#c4b595" stroke-width="2"/>

  <!-- Multi-tier Security Border -->
  <rect x="76" y="76" width="748" height="1098" fill="none" stroke="url(#goldLeaf)" stroke-width="3"/>
  <rect x="83" y="83" width="734" height="1084" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="91" y="91" width="718" height="1068" fill="none" stroke="#b8860b" stroke-width="0.8" stroke-dasharray="6,3"/>
  <rect x="97" y="97" width="706" height="1056" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Vintage Ornate Corner Filigree -->
  <!-- Top Left -->
  <g transform="translate(76, 76)">
    <path d="M 0 0 L 55 0 C 35 20, 20 35, 0 55 Z" fill="url(#goldLeaf)"/>
    <path d="M 6 6 L 42 6 Q 18 18, 6 42 Z" fill="#0f172a"/>
    <circle cx="24" cy="24" r="5" fill="url(#goldLeaf)"/>
    <path d="M 0 55 Q 30 40, 55 0" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  </g>
  <!-- Top Right -->
  <g transform="translate(824, 76) scale(-1, 1)">
    <path d="M 0 0 L 55 0 C 35 20, 20 35, 0 55 Z" fill="url(#goldLeaf)"/>
    <path d="M 6 6 L 42 6 Q 18 18, 6 42 Z" fill="#0f172a"/>
    <circle cx="24" cy="24" r="5" fill="url(#goldLeaf)"/>
    <path d="M 0 55 Q 30 40, 55 0" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  </g>
  <!-- Bottom Left -->
  <g transform="translate(76, 1174) scale(1, -1)">
    <path d="M 0 0 L 55 0 C 35 20, 20 35, 0 55 Z" fill="url(#goldLeaf)"/>
    <path d="M 6 6 L 42 6 Q 18 18, 6 42 Z" fill="#0f172a"/>
    <circle cx="24" cy="24" r="5" fill="url(#goldLeaf)"/>
    <path d="M 0 55 Q 30 40, 55 0" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  </g>
  <!-- Bottom Right -->
  <g transform="translate(824, 1174) scale(-1, -1)">
    <path d="M 0 0 L 55 0 C 35 20, 20 35, 0 55 Z" fill="url(#goldLeaf)"/>
    <path d="M 6 6 L 42 6 Q 18 18, 6 42 Z" fill="#0f172a"/>
    <circle cx="24" cy="24" r="5" fill="url(#goldLeaf)"/>
    <path d="M 0 55 Q 30 40, 55 0" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- ==================== CERTIFICATE CONTENT ==================== -->

  <!-- Official Accreditation Header Icon / Seal Top -->
  <g transform="translate(450, 145)">
    <circle cx="0" cy="0" r="28" fill="url(#goldLeaf)"/>
    <circle cx="0" cy="0" r="24" fill="#0b1e36"/>
    <!-- Crest Crown / Gear -->
    <path d="M-10 -7 L-4 -14 L0 -7 L4 -14 L10 -7 L7 10 L-7 10 Z" fill="url(#goldLeaf)"/>
    <circle cx="0" cy="2" r="3" fill="#0b1e36"/>
    <!-- Side Flourishes -->
    <path d="M -110 0 C -70 -18, -40 10, -35 0" fill="none" stroke="url(#goldLeaf)" stroke-width="2"/>
    <path d="M 110 0 C 70 -18, 40 10, 35 0" fill="none" stroke="url(#goldLeaf)" stroke-width="2"/>
    <circle cx="-115" cy="0" r="3.5" fill="url(#goldLeaf)"/>
    <circle cx="115" cy="0" r="3.5" fill="url(#goldLeaf)"/>
  </g>

  <text x="450" y="195" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="11" font-weight="bold" fill="#786028" letter-spacing="4">INTERNATIONAL ACCREDITATION MANAGEMENT SERVICES</text>

  <!-- Title -->
  <text x="450" y="235" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="32" font-weight="bold" fill="#111827" letter-spacing="5">ENVIRONMENTAL CERTIFICATE OF REGISTRATION</text>
  
  <line x1="330" y1="248" x2="570" y2="248" stroke="url(#goldLeaf)" stroke-width="1.5"/>
  <circle cx="450" cy="248" r="3" fill="#b8860b"/>

  <text x="450" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#4b5563">This is to certify that the Management &amp; Quality Operations of:</text>

  <!-- Company Name Box -->
  <g transform="translate(450, 335)">
    <rect x="-310" y="-35" width="620" height="58" rx="3" fill="#ffffff" fill-opacity="0.8" stroke="url(#goldLeaf)" stroke-width="1.5"/>
    <rect x="-306" y="-31" width="612" height="50" fill="none" stroke="#1e293b" stroke-width="0.8"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="2">FERRYTECH HEAVY MACHINERY &amp; EQUIPMENT LTD</text>
  </g>

  <text x="450" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#475569">Industrial Zone 4, Port Logistics Park, London, WC1B 3DG, United Kingdom</text>

  <text x="450" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#334155">has been comprehensively audited, assessed and verified to strictly conform with:</text>

  <!-- Standard Large Display Box -->
  <g transform="translate(450, 495)">
    <rect x="-240" y="-45" width="480" height="74" rx="5" fill="#ffffff" stroke="url(#goldLeaf)" stroke-width="3" filter="url(#sealShadow)"/>
    <rect x="-235" y="-40" width="470" height="64" rx="3" fill="none" stroke="#0f172a" stroke-width="1"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#0b1e36" letter-spacing="4">ISO 14001:2015</text>
    <text x="0" y="16" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#786028" letter-spacing="1.5">ENVIRONMENTAL MANAGEMENT SYSTEM</text>
  </g>

  <!-- Scope Box -->
  <text x="450" y="570" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b" letter-spacing="2">APPROVED SCOPE OF CERTIFICATION &amp; OPERATIONS:</text>
  
  <g transform="translate(450, 590)">
    <rect x="-310" y="0" width="620" height="110" rx="4" fill="#f8f6ee" stroke="#d5c8ab" stroke-width="1.2"/>
    <foreignObject x="-295" y="12" width="590" height="88">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Georgia, 'Times New Roman', serif; font-size: 14px; line-height: 1.55; color: #1f2937; text-align: center; font-weight: 500;">
        Environmental management of heavy construction equipment assembly, eco-friendly remanufacturing, low-emission fleet operations, and certified hazardous fluids handling protocols.
      </div>
    </foreignObject>
  </g>

  <!-- Certification Metadata Grid -->
  <g transform="translate(140, 735)">
    <rect x="0" y="0" width="620" height="86" fill="#ffffff" fill-opacity="0.9" stroke="url(#goldLeaf)" stroke-width="1.2" rx="3"/>
    
    <text x="25" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b" letter-spacing="1">CERTIFICATE NUMBER:</text>
    <text x="25" y="58" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#0f172a">EMS 774192</text>

    <line x1="220" y1="12" x2="220" y2="74" stroke="#e2d8bf" stroke-width="1"/>
    
    <text x="240" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b" letter-spacing="1">ORIGINAL DATE:</text>
    <text x="240" y="58" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0f172a">12 November 2019</text>

    <line x1="420" y1="12" x2="420" y2="74" stroke="#e2d8bf" stroke-width="1"/>
    
    <text x="440" y="32" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="bold" fill="#64748b" letter-spacing="1">EXPIRY DATE:</text>
    <text x="440" y="58" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0f172a">14 November 2026</text>
  </g>

  <!-- Rubber Stamp on Left Side (Realistic Notary Impression) -->
  <g transform="translate(230, 930) rotate(-12)" opacity="0.82">
    <circle cx="0" cy="0" r="54" fill="none" stroke="#14452f" stroke-width="2.5" stroke-dasharray="14,3"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#14452f" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#14452f" stroke-width="1"/>
    <path d="M-22 0 L22 0" stroke="#14452f" stroke-width="1.5"/>
    <text x="0" y="-12" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="900" fill="#14452f" letter-spacing="1">VERIFIED &amp; VALID</text>
    <text x="0" y="14" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#14452f" letter-spacing="1">AUDITED</text>
    <text x="0" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="#14452f">UKAS / IAF</text>
  </g>

  <!-- Signatures Section -->
  <!-- Left Signatory -->
  <g transform="translate(170, 960)">
    <!-- Realistic Handwriting Path -->
    <path d="M 10 0 C 35 -30, 50 15, 80 -18 C 105 -35, 125 0, 150 -15 C 175 -30, 185 -5, 205 -12" fill="none" stroke="#0a2540" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 40 -8 C 65 -35, 90 -25, 115 -12" fill="none" stroke="#0a2540" stroke-width="1.8"/>
    <line x1="0" y1="12" x2="220" y2="12" stroke="#1f2937" stroke-width="1.2"/>
    <text x="110" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0f172a">Dr. Arthur Morgan, CEng</text>
    <text x="110" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" font-style="italic" fill="#64748b">Lead Technical Registrar</text>
  </g>

  <!-- Right Signatory -->
  <g transform="translate(510, 960)">
    <!-- Realistic Handwriting Path -->
    <path d="M 15 -12 C 40 -38, 65 8, 95 -22 C 120 -38, 145 2, 170 -16 C 190 -32, 205 -5, 220 -10" fill="none" stroke="#0a2540" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 50 -18 C 80 -30, 110 -15, 140 -5" fill="none" stroke="#0a2540" stroke-width="1.8"/>
    <line x1="0" y1="12" x2="220" y2="12" stroke="#1f2937" stroke-width="1.2"/>
    <text x="110" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0f172a">Eleanor Davies, MSc</text>
    <text x="110" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="11.5" font-style="italic" fill="#64748b">Global Compliance Director</text>
  </g>

  <!-- ==================== 3D GOLD EMBOSSED SEAL & RIBBON ==================== -->
  <g transform="translate(710, 980)" filter="url(#sealShadow)">
    <!-- Satin Ribbon Tails -->
    <path d="M -30 35 L -52 125 L -26 108 L 0 125 L -14 35 Z" fill="#14452f"/>
    <path d="M 30 35 L 52 125 L 26 108 L 0 125 L 14 35 Z" fill="#14452f"/>
    <!-- Ribbon Gold Edge Trim -->
    <path d="M -52 125 L -26 108 L 0 125" fill="none" stroke="url(#goldLeaf)" stroke-width="2.5"/>
    <path d="M 52 125 L 26 108 L 0 125" fill="none" stroke="url(#goldLeaf)" stroke-width="2.5"/>

    <!-- Starburst Serrated Outer Seal (24 Points) -->
    <path d="M 0 -62 L 8 -56 L 16 -60 L 23 -52 L 32 -54 L 38 -44 L 47 -43 L 51 -32 L 59 -28 L 60 -17 L 65 -11 L 63 0 L 65 11 L 60 17 L 59 28 L 51 32 L 47 43 L 38 44 L 32 54 L 23 52 L 16 60 L 8 56 L 0 62 L -8 56 L -16 60 L -23 52 L -32 54 L -38 44 L -47 43 L -51 32 L -59 28 L -60 17 L -65 11 L -63 0 L -65 -11 L -60 -17 L -59 -28 L -51 -32 L -47 -43 L -38 -44 L -32 -54 L -23 -52 L -16 -60 L -8 -56 Z" fill="url(#sealEmboss)"/>
    
    <!-- Metallic Inner Rings -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="0" cy="0" r="50" fill="#14452f"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#goldLeaf)" stroke-width="2"/>
    
    <!-- Inner Medallion Center -->
    <circle cx="0" cy="0" r="32" fill="url(#sealEmboss)" opacity="0.3"/>
    
    <text x="0" y="-18" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#ffd700" letter-spacing="1.5">★ OFFICIAL ★</text>
    <text x="0" y="4" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">ISO 14001</text>
    <text x="0" y="20" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#ffd700" letter-spacing="1">ACCREDITED</text>
