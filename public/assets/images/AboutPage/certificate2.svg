  <!-- Glass Sheen Across the Whole Frame -->
  <polygon points="15,15 500,15 15,650" fill="url(#glassSheen)"/>
  <polygon points="400,15 885,15 885,600 15,1235 15,1000" fill="url(#glassSheen)"/>

</svg>